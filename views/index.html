

<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{titulo}}</title>
</head>
<body>
    <a href="/profile">Ir para o perfil</a>
    <h1>Bem-vindo, {{nome}}!</h1>

    {{#if autenticado}}
        <p>Estás autenticado.</p>
    {{else}}
        <p>Inicia sessão para continuar.</p>
    {{/if}}

    <h2>Produtos</h2>
    <ul>
        {{#each produtos}}
            <li>{{nome}} — {{preco}} Kz</li>
        {{/each}}
    </ul>
</body>
</html>
