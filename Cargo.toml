[package]
name = "rustpress"
version = "0.1.0"
edition = "2024"
description = "A lightweight HTTP framework for Rust inspired by Express.js"
license = "MIT"
readme = "README.md"
repository = "https://github.com/fabriciomichael/rustpress-web"
documentation = "https://docs.rs/rustpress"
keywords = ["http", "web", "framework", "router", "server"]
categories = ["web-programming::http-server"]

[dependencies]
hyper = { version = "1", features = ["http1", "server"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
serde_json = "1"
bytes = "1"
http = "1"